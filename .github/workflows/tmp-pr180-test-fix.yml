name: Temp PR180 Test Fix
on:
  push:
    branches:
      - feat/intensive-partial-payments-20260909
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intensive-partial-payments-20260909
      - name: Fix static assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/intensivo-payment-regressions.mjs')
          s=p.read_text()
          old="assert.ok(paymentPage.includes('ANTICIPO '+money(curso.pagado_total)));"
          new="assert.ok(paymentPage.includes(\"'ANTICIPO '+money(curso.pagado_total)\"));"
          if old not in s:
              raise SystemExit('assertion pattern missing')
          p.write_text(s.replace(old,new,1))
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'Hache Interactive'
          git config user.email 'manglefurniture@gmail.com'
          git add tests/intensivo-payment-regressions.mjs
          git commit -m 'test: corregir aserción de anticipo intensivo'
          git push origin HEAD:feat/intensive-partial-payments-20260909
