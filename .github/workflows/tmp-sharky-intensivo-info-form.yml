name: Temporary Sharky intensive guided patch

on:
  push:
    branches:
      - feat/sharky-intensivo-info-form

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sharky-intensivo-info-form
          fetch-depth: 0
      - name: Apply patch when ready
        run: |
          if [ ! -f .tmp-sharky-patch-ready ]; then
            echo "Patch parts not ready yet"
            exit 0
          fi
          python .tmp-sharky-patch-adapter.py
          python .tmp-sharky-patch-followup.py
          python .tmp-sharky-patch-tests.py
          php -l config/sharky-whatsapp-adapter.php
          php -l config/sharky-whatsapp-batching.php
          php -l config/sharky-followup.php
          php tests/sharky-commercial-next-action-regression.php
          php tests/sharky-followup-regression.php
          php tests/sharky-batch-context-regression.php
          php tests/sharky-guided-onboarding-regression.php
          rm -f .tmp-sharky-patch-ready .tmp-sharky-patch-adapter.py .tmp-sharky-patch-followup.py .tmp-sharky-patch-tests.py .github/workflows/tmp-sharky-intensivo-info-form.yml
          git config user.name "Hache Interactive"
          git config user.email "manglefurniture@gmail.com"
          git add -A
          git commit -m "feat: simplificar conversión de prospectos intensivos"
          git push origin HEAD:feat/sharky-intensivo-info-form
