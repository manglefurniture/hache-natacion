name: Build Hache APK Test

on:
  push:
    branches:
      - android-apk-test
    paths:
      - 'android-test/**'
      - '.github/workflows/build-hache-apk-test.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build test APK
        working-directory: android-test
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p android-test/output
          cp android-test/app/build/outputs/apk/debug/app-debug.apk android-test/output/Hache-Natacion-v0.2.0-debug.apk

      - name: Export apksigner
        shell: bash
        run: |
          mkdir -p android-test/signing-tool/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" android-test/signing-tool/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-test/signing-tool/lib/
          chmod +x android-test/signing-tool/apksigner

      - name: Upload APK package
        uses: actions/upload-artifact@v4
        with:
          name: hache-natacion-apk-debug
          path: android-test/output/*
          retention-days: 30

      - name: Upload signing tool
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: android-test/signing-tool/**
          retention-days: 1
