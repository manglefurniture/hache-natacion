name: Temp professor assign fix

on:
  push:
    branches: [fix/profesores-assign-ui-p2-20260909]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profesores-assign-ui-p2-20260909
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Apply fixes
        run: |
          printf '%s' '' | base64 -d > /tmp/profesor_fix.py
          python3 /tmp/profesor_fix.py
          php -l config/sharky-member-ops.php
          php -l public/profesores.php
          php -l tests/sharky-member-ops-regression.php
          php tests/sharky-member-ops-regression.php
          rm -f .github/workflows/temp-profesor-assign-fix.yml
          git config user.name "Hache Interactive"
          git config user.email "manglefurniture@gmail.com"
          git add -A
          git commit -m "fix: reparar asignación de horarios a profesores"
          git push origin HEAD:fix/profesores-assign-ui-p2-20260909