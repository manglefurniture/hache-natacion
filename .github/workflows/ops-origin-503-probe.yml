name: Ops Origin 503 Probe

on:
  push:
    branches:
      - ops/origin-503-probe-20260905
    paths:
      - .github/workflows/ops-origin-503-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Probe origin and service status without secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          printf 'nginx_active=%s\n' "$(systemctl is-active nginx 2>/dev/null || true)"
          for unit in php8.4-fpm php8.3-fpm php8.2-fpm; do
            state="$(systemctl is-active "$unit" 2>/dev/null || true)"
            [[ -n "$state" ]] && printf '%s_active=%s\n' "$unit" "$state"
          done

          printf 'listen_443=%s\n' "$(ss -ltn 2>/dev/null | awk '$4 ~ /:443$/ {found=1} END{print found?"yes":"no"}')"
          printf 'listen_80=%s\n' "$(ss -ltn 2>/dev/null | awk '$4 ~ /:80$/ {found=1} END{print found?"yes":"no"}')"
          printf 'php_socket_count=%s\n' "$(find /run/php -maxdepth 1 -type s 2>/dev/null | wc -l | tr -d ' ')"

          probe() {
            local label="$1" url="$2" code
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --resolve hnatacion.com:443:127.0.0.1 \
              --connect-timeout 10 --max-time 30 \
              "$url" || true)"
            printf '%s_status=%s\n' "$label" "${code:-curl_error}"
          }

          probe home https://hnatacion.com/
          probe hachi https://hnatacion.com/assets/hachi.js?v=20260905-rum1
          probe rum_build https://hnatacion.com/api/rum-build.php
          probe health https://hnatacion.com/api/health.php

          printf 'repo_head=%s\n' "$(git -C /var/www/hache-natacion rev-parse HEAD 2>/dev/null || echo unavailable)"
          REMOTE
