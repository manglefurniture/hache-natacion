name: Ops Origin 503 Probe

on:
  push:
    branches:
      - ops/origin-503-probe-20260905
    paths:
      - .github/workflows/ops-origin-503-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Diagnose RUM build endpoint without secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/var/www/hache-natacion
          marker="$root/.hache-deployed-sha"
          expected='b241f8b851a3c5561b154de033ceb2e10df01959'

          printf 'marker_stat=%s\n' "$(stat -c '%U:%G %a %F' "$marker" 2>/dev/null || echo missing)"
          actual="$(tr -d '\r\n' < "$marker" 2>/dev/null || true)"
          [[ "$actual" == "$expected" ]] && echo 'marker_matches_current=yes' || echo 'marker_matches_current=no'

          php -r 'require "/var/www/hache-natacion/config/production-rum.php"; $v=hache_rum_deployed_build_id("/var/www/hache-natacion"); echo "cli_build=".($v??"null")."\n";'
          printf 'php_cli_version=%s\n' "$(php -r 'echo PHP_VERSION;' 2>/dev/null || true)"
          printf 'fpm_workers='; ps -eo user,group,comm,args | awk '/php-fpm: pool/ {printf "%s:%s ",$1,$2} END{print ""}'

          body="$(mktemp)"
          code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --resolve hnatacion.com:443:127.0.0.1 https://hnatacion.com/api/rum-build.php || true)"
          printf 'rum_build_status=%s\n' "$code"
          printf 'rum_build_body='; tr '\n\r' '  ' < "$body" | head -c 300; printf '\n'
          rm -f "$body"
          REMOTE
