name: Ops Origin 503 Probe

on:
  push:
    branches:
      - ops/origin-503-probe-20260905
    paths:
      - .github/workflows/ops-origin-503-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Probe origin and RUM git metadata without secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/var/www/hache-natacion
          gitdir="$root/.git"

          printf 'nginx_active=%s\n' "$(systemctl is-active nginx 2>/dev/null || true)"
          printf 'php8.4-fpm_active=%s\n' "$(systemctl is-active php8.4-fpm 2>/dev/null || true)"

          probe() {
            local label="$1" url="$2" code
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --resolve hnatacion.com:443:127.0.0.1 \
              --connect-timeout 10 --max-time 30 \
              "$url" || true)"
            printf '%s_status=%s\n' "$label" "${code:-curl_error}"
          }
          probe home https://hnatacion.com/
          probe rum_build https://hnatacion.com/api/rum-build.php
          probe health https://hnatacion.com/api/health.php

          stat_safe() {
            local label="$1" path="$2"
            if [[ -e "$path" ]]; then
              printf '%s_stat=%s\n' "$label" "$(stat -c '%U:%G %a %F' "$path" 2>/dev/null || echo stat_denied)"
              printf '%s_readable=%s\n' "$label" "$([[ -r "$path" ]] && echo yes || echo no)"
              printf '%s_traversable=%s\n' "$label" "$([[ -d "$path" && -x "$path" ]] && echo yes || echo no)"
            else
              printf '%s_exists=no\n' "$label"
            fi
          }

          stat_safe repo "$root"
          stat_safe gitdir "$gitdir"
          stat_safe git_head "$gitdir/HEAD"
          stat_safe refs "$gitdir/refs"
          stat_safe refs_heads "$gitdir/refs/heads"
          stat_safe main_ref "$gitdir/refs/heads/main"
          stat_safe packed_refs "$gitdir/packed-refs"

          if command -v namei >/dev/null 2>&1; then
            printf 'head_path_components_begin\n'
            namei -l "$gitdir/HEAD" 2>/dev/null | sed -E 's/[[:space:]]+/ /g' || true
            printf 'head_path_components_end\n'
          fi
          REMOTE
