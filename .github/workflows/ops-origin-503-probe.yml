name: Ops Origin 503 Probe

on:
  push:
    branches:
      - ops/origin-503-probe-20260905
    paths:
      - .github/workflows/ops-origin-503-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Probe deployed SHA marker without secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/var/www/hache-natacion
          marker="$root/.hache-deployed-sha"
          expected='fabd85959725ad1ea80dffeff109ae8ef6f86f5b'

          printf 'home_status=%s\n' "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --resolve hnatacion.com:443:127.0.0.1 https://hnatacion.com/ || true)"
          printf 'health_status=%s\n' "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --resolve hnatacion.com:443:127.0.0.1 https://hnatacion.com/api/health.php || true)"

          if [[ -e "$marker" ]]; then
            printf 'marker_stat=%s\n' "$(stat -c '%U:%G %a %F' "$marker" 2>/dev/null || echo stat_denied)"
            printf 'marker_readable=%s\n' "$([[ -r "$marker" ]] && echo yes || echo no)"
            actual="$(tr -d '\r\n' < "$marker" 2>/dev/null || true)"
            if [[ "$actual" == "$expected" ]]; then
              echo 'marker_matches_expected=yes'
            else
              echo 'marker_matches_expected=no'
            fi
          else
            echo 'marker_exists=no'
          fi
          REMOTE
