name: Salad experimental 4070 to 4090 (one-time)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/salad-4090-experimental.yml

permissions:
  contents: read

concurrency:
  group: salad-4090-experimental-once
  cancel-in-progress: false

jobs:
  gpu-only-change:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify switch logic with mocked Salad responses
        run: node --test tests/salad-gpu-switch-regression.mjs
      - name: Switch only the experimental Container Group GPU
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
        run: node ops/salad-gpu-switch.mjs
