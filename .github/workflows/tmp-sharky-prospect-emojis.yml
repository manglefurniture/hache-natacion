name: Temporary Sharky prospect emojis

on:
  push:
    branches: [feat/sharky-prospect-emojis]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[emoji-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sharky-prospect-emojis
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Apply scoped copy/style changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          adapter='config/sharky-whatsapp-adapter.php'
          replace_once(
              adapter,
              "$message=rtrim($prefix).' En '.$sedeLabel.', el curso intensivo tiene un precio total de $'.$priceText.' MXN. Es un solo pago por el curso completo.';",
              "$lead=rtrim($prefix);\n    if($lead==='Perfecto.')$lead='¡Perfecto! 🏊‍♂️';\n    $message=$lead.\"\\n\\n📍 Ya tengo tu sede: \".$sedeLabel.\".\\n\\n💰 El curso intensivo tiene un precio total de $\".$priceText.\" MXN.\\n✅ Es un solo pago por el curso completo.\";"
          )
          replace_once(adapter, 'Horarios disponibles:', '🕒 Horarios disponibles:')
          replace_once(
              adapter,
              '    }\n    return $message;\n}\n\nfunction hache_sharky_whatsapp_commercial_next_action',
              '    }\n    $message.="\\n\\nSi quieres, puedes inscribirte ahora mismo ✍️";\n    return $message;\n}\n\nfunction hache_sharky_whatsapp_commercial_next_action'
          )

          flows='config/sharky-commerce-flows.php'
          replace_once(
              flows,
              "hache_sharky_whatsapp_commercial_next_action($state,'Entendido, cancelé el formulario. Conservé tu curso y sede.')",
              "hache_sharky_whatsapp_commercial_next_action($state,'Entendido 😊 Cancelé el formulario. Conservé tu curso y sede.')"
          )
          replace_once(
              flows,
              "?'Ya tengo tu sede, fecha y horario. Completa tus datos en este formulario para continuar con la inscripción.'",
              "?'✅ Ya tengo tu sede, fecha y horario. ✍️ Completa tus datos en este formulario para continuar con la inscripción.'"
          )
          replace_once(
              flows,
              ":'Completa en un solo formulario los datos de tu inscripción. La sede queda fija en '.(string)$data['venue_label'].'.';",
              ":'✍️ Completa en un solo formulario los datos de tu inscripción. 📍 La sede queda fija en '.(string)$data['venue_label'].'.';"
          )

          style='config/sharky-post-pr72.php'
          replace_once(
              style,
              "        '- Puedes usar un emoji funcional en un encabezado (por ejemplo 📍, 🕐, 💰 o ✅), pero no en cada línea.',",
              "        '- En orientación comercial para prospectos, usa de 2 a 5 emojis funcionales y naturales por respuesta (por ejemplo 🏊‍♂️, 📍, 💰, 🕒, ✅ o ✍️) para dar un tono más alegre sin saturar.',\n        '- En mensajes operativos para alumnos registrados, mantén los emojis más contenidos: normalmente 1 a 3 cuando aporten claridad.',"
          )

          test='tests/sharky-commercial-next-action-regression.php'
          replace_once(
              test,
              "commercial_next_ok(str_contains((string)($menu['message']??''),'precio total')&&str_contains((string)($menu['message']??''),'un solo pago'),'Intensive venue completion must provide price automatically.');",
              "commercial_next_ok(str_contains((string)($menu['message']??''),'precio total')&&str_contains((string)($menu['message']??''),'un solo pago'),'Intensive venue completion must provide price automatically.');\n$intensiveMessage=(string)($menu['message']??'');\nforeach(['🏊‍♂️','📍','💰','✅','🕒','✍️'] as $emoji){\n    commercial_next_ok(str_contains($intensiveMessage,$emoji),'Intensive prospect information should keep the warmer visual cue '.$emoji.'.');\n}"
          )
          PY

      - name: Validate targeted regressions
        run: |
          php -l config/sharky-whatsapp-adapter.php
          php -l config/sharky-commerce-flows.php
          php -l config/sharky-post-pr72.php
          php tests/sharky-commercial-next-action-regression.php
          php tests/sharky-commerce-flows-regression.php
          php tests/sharky-guided-onboarding-regression.php
          php tests/sharky-followup-regression.php

      - name: Commit patch
        run: |
          git config user.name "Hache Interactive"
          git config user.email "manglefurniture@gmail.com"
          git add config/sharky-whatsapp-adapter.php config/sharky-commerce-flows.php config/sharky-post-pr72.php tests/sharky-commercial-next-action-regression.php
          git commit -m "feat: alegrar mensajes comerciales de Sharky [emoji-patch]"
          git push origin HEAD:feat/sharky-prospect-emojis
