name: Salad one-time: grupo ocho to RTX 4090

on:
  pull_request:
    paths:
      - .github/workflows/salad-4070-ocho-once.yml
      - ops/salad-4070-ocho-one-shot.mjs
      - tests/salad-4070-ocho-one-shot.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/salad-4070-ocho-once.yml

permissions:
  contents: read

concurrency:
  group: salad-prl-gpu-changes
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Regression and safe GPU-only contract
        run: |
          node --check ops/salad-4070-ocho-one-shot.mjs
          node --test tests/salad-4070-ocho-one-shot.test.mjs tests/salad-gpu-switch-regression.mjs

  apply-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Switch only prl-low-4070-ocho to desktop RTX 4090
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
        run: node ops/salad-4070-ocho-one-shot.mjs
