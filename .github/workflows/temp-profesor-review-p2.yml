name: Temp professor review P2

on:
  push:
    branches: [fix/profesores-coteaching-review-p2-20260910]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profesores-coteaching-review-p2-20260910
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Apply review fixes
        run: |
          cat > /tmp/professor_p2.py <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing target: {label}")
              return text.replace(old, new, 1)

          p=Path("config/sharky-member-ops.php")
          text=p.read_text()
          old_helper="""function hache_sharky_member_coteaching_ready(PDO $pdo): bool
          {
              try{
                  $st=$pdo->prepare("SELECT GROUP_CONCAT(column_name ORDER BY seq_in_index SEPARATOR ',') columns_in_order,MIN(non_unique) non_unique FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='profesor_cancelaciones' AND index_name='uq_profesor_cancelacion_profesor_sesion' GROUP BY index_name");
                  $st->execute();$row=$st->fetch(PDO::FETCH_ASSOC);
                  return is_array($row)&&(string)($row['columns_in_order']??'')==='profesor_id,sesion_id'&&(int)($row['non_unique']??1)===0;
              }catch(Throwable $e){return false;}
          }
          """
          new_helper="""function hache_sharky_member_coteaching_ready(PDO $pdo): bool
          {
              try{
                  $st=$pdo->prepare("SELECT GROUP_CONCAT(column_name ORDER BY seq_in_index SEPARATOR ',') columns_in_order,MIN(non_unique) non_unique FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='profesor_cancelaciones' AND index_name='uq_profesor_cancelacion_profesor_sesion' GROUP BY index_name");
                  $st->execute();$row=$st->fetch(PDO::FETCH_ASSOC);
                  if(!is_array($row)||(string)($row['columns_in_order']??'')!=='profesor_id,sesion_id'||(int)($row['non_unique']??1)!==0)return false;
                  $legacy=$pdo->prepare("SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='profesor_cancelaciones' AND index_name='uq_profesor_cancelacion_sesion'");
                  $legacy->execute();
                  return (int)$legacy->fetchColumn()===0;
              }catch(Throwable $e){return false;}
          }
          """
          text=once(text,old_helper,new_helper,"coteaching helper legacy gate")

          old_identity="""function hache_sharky_member_teacher_by_whatsapp(PDO $pdo,string $contact): array
          {
              if(!hache_sharky_member_schema_ready($pdo)||!hache_sharky_member_coteaching_ready($pdo))return ['found'=>false,'reason'=>'schema_unavailable'];
          """
          new_identity="""function hache_sharky_member_teacher_by_whatsapp(PDO $pdo,string $contact): array
          {
              if(!hache_sharky_member_schema_ready($pdo))return ['found'=>false,'reason'=>'schema_unavailable'];
          """
          text=once(text,old_identity,new_identity,"teacher identity independent readiness")

          old_gate="""    $isEvidence=(string)($event['kind']??'')===HACHE_SHARKY_MEMBER_EVIDENCE_KIND;
              $teacherFlow=is_array($flow)&&str_starts_with((string)($flow['name']??''),'teacher_');$studentFlow=is_array($flow)&&($flow['name']??'')==='absence';
              if(($teacher['found']??false)!==true&&($student['found']??false)!==true&&!$teacherFlow&&!$studentFlow)return null;
          
              $deliveryLock=hache_sharky_orchestrator_delivery_lock($contact);if(!is_resource($deliveryLock))return false;
          """
          new_gate="""    $isEvidence=(string)($event['kind']??'')===HACHE_SHARKY_MEMBER_EVIDENCE_KIND;
              $teacherFlow=is_array($flow)&&str_starts_with((string)($flow['name']??''),'teacher_');$studentFlow=is_array($flow)&&($flow['name']??'')==='absence';
              if(($teacher['found']??false)!==true&&($student['found']??false)!==true&&!$teacherFlow&&!$studentFlow)return null;
              $teacherOwned=($teacher['found']??false)===true&&($teacherFlow||in_array($intent,['teacher_agenda','teacher_cancel','teacher_cancel_select','greeting','member:tc_confirm','member:tc_abort'],true));
              if($teacherOwned&&!hache_sharky_member_coteaching_ready($pdo))return null;
          
              $deliveryLock=hache_sharky_orchestrator_delivery_lock($contact);if(!is_resource($deliveryLock))return false;
          """
          text=once(text,old_gate,new_gate,"teacher process preclaim readiness")
          p.write_text(text)

          p=Path("config/sharky-member-routing.php")
          text=p.read_text()
          old_owned="""function hache_sharky_member_teacher_owned_event(array $teacher,?array $flow,array $event,?string $intent=null): bool
          {
              if(($teacher['found']??false)!==true)return false;
          """
          new_owned="""function hache_sharky_member_teacher_owned_event(PDO $pdo,array $teacher,?array $flow,array $event,?string $intent=null): bool
          {
              if(($teacher['found']??false)!==true||!hache_sharky_member_coteaching_ready($pdo))return false;
          """
          text=once(text,old_owned,new_owned,"teacher owned helper signature/readiness")
          text=once(text,"if(hache_sharky_member_teacher_owned_event($teacher,$routingFlow,$event,$intent))return null;","if(hache_sharky_member_teacher_owned_event($pdo,$teacher,$routingFlow,$event,$intent))return null;","teacher owned helper call")

          old_det="""    $flow=hache_sharky_member_flow($state);$flowName=(string)($flow['name']??'');
              if(in_array($flowName,['absence','teacher_cancel'],true))return true;
          
              $intent=hache_sharky_member_intent((string)($event['text']??''),(string)($event['interactive_id']??''));
              $teacher=hache_sharky_member_teacher_by_whatsapp($pdo,(string)($event['from']??''));
              if(($teacher['found']??false)===true&&in_array($intent,['greeting','teacher_agenda','teacher_cancel','teacher_cancel_select','member:tc_confirm','member:tc_abort'],true))return true;
          """
          new_det="""    $flow=hache_sharky_member_flow($state);$flowName=(string)($flow['name']??'');
              if($flowName==='absence')return true;
              if($flowName==='teacher_cancel')return hache_sharky_member_coteaching_ready($pdo);
          
              $intent=hache_sharky_member_intent((string)($event['text']??''),(string)($event['interactive_id']??''));
              $teacher=hache_sharky_member_teacher_by_whatsapp($pdo,(string)($event['from']??''));
              if(($teacher['found']??false)===true&&hache_sharky_member_coteaching_ready($pdo)&&in_array($intent,['greeting','teacher_agenda','teacher_cancel','teacher_cancel_select','member:tc_confirm','member:tc_abort'],true))return true;
          """
          text=once(text,old_det,new_det,"deterministic teacher readiness")

          old_intent="""    $teacherFlow=is_array($activeFlow)&&str_starts_with((string)($activeFlow['name']??''),'teacher_');
              $teacherIntent=($teacher['found']??false)===true&&($teacherFlow||in_array($intent,['greeting','teacher_agenda','teacher_cancel','teacher_cancel_select','member:tc_confirm','member:tc_abort'],true));
          """
          new_intent="""    $teacherFlow=is_array($activeFlow)&&str_starts_with((string)($activeFlow['name']??''),'teacher_');
              $teacherIntent=($teacher['found']??false)===true&&hache_sharky_member_coteaching_ready($pdo)&&($teacherFlow||in_array($intent,['greeting','teacher_agenda','teacher_cancel','teacher_cancel_select','member:tc_confirm','member:tc_abort'],true));
          """
          text=once(text,old_intent,new_intent,"route teacher readiness")
          p.write_text(text)

          p=Path("tests/sharky-member-ops-regression.php")
          text=p.read_text()
          anchor="""member_ok(str_contains($memberOps,'function hache_sharky_member_coteaching_ready'),'Teacher routing must have an explicit co-teaching readiness gate.');
          member_ok(str_contains($memberOps,'uq_profesor_cancelacion_profesor_sesion')&&str_contains($memberOps,"profesor_id,sesion_id"),'Teacher routing must verify the composite professor/session index before accepting co-teaching operations.');
          """
          extra="""member_ok(str_contains($memberOps,"index_name='uq_profesor_cancelacion_sesion'"),'Co-teaching readiness must reject a schema that still retains the legacy session-only unique index.');
          $teacherIdentityStart=strpos($memberOps,'function hache_sharky_member_teacher_by_whatsapp');
          $teacherIdentityEnd=$teacherIdentityStart===false?false:strpos($memberOps,'function hache_sharky_member_flow',$teacherIdentityStart);
          $teacherIdentity=($teacherIdentityStart!==false&&$teacherIdentityEnd!==false)?substr($memberOps,$teacherIdentityStart,$teacherIdentityEnd-$teacherIdentityStart):'';
          member_ok($teacherIdentity!==''&&!str_contains($teacherIdentity,'hache_sharky_member_coteaching_ready'),'Teacher identity recognition must remain independent from co-teaching migration readiness.');
          member_ok(str_contains($memberOps,'if($teacherOwned&&!hache_sharky_member_coteaching_ready($pdo))return null;'),'Teacher operations must stop before claiming an event when co-teaching schema is incomplete.');
          """
          text=once(text,anchor,anchor+extra,"member static P2 assertions")
          anchor2="""$memberRouter=(string)file_get_contents($root.'/config/sharky-member-routing.php');
          """
          extra2="""member_ok(str_contains($memberRouter,'hache_sharky_member_teacher_owned_event(PDO $pdo'),'Teacher event ownership must receive DB readiness context.');
          member_ok(str_contains($memberRouter,"flowName==='teacher_cancel'")&&str_contains($memberRouter,'return hache_sharky_member_coteaching_ready($pdo);'),'Teacher cancellation flows must remain dormant until co-teaching schema is ready.');
          member_ok(str_contains($memberRouter,'$teacherIntent=')&&str_contains($memberRouter,'&&hache_sharky_member_coteaching_ready($pdo)&&'),'Teacher route selection must be gated on co-teaching readiness without hiding teacher identity.');
          """
          text=once(text,anchor2,anchor2+extra2,"router P2 assertions")
          p.write_text(text)

          p=Path("tests/sharky-professor-coteaching-mariadb.php")
          text=p.read_text()
          anchor3="""require_once __DIR__.'/../config/sharky-member-ops.php';
          """
          extra3="""coteach_expect(hache_sharky_member_coteaching_ready($pdo),'Composite co-teaching index should be ready by itself.');
          $pdo->exec("CREATE UNIQUE INDEX uq_profesor_cancelacion_sesion ON profesor_cancelaciones(sesion_id)");
          coteach_expect(!hache_sharky_member_coteaching_ready($pdo),'Legacy session-only uniqueness must make co-teaching readiness fail closed.');
          $pdo->exec("DROP INDEX uq_profesor_cancelacion_sesion ON profesor_cancelaciones");
          coteach_expect(hache_sharky_member_coteaching_ready($pdo),'Dropping the legacy session-only index must restore co-teaching readiness.');
          """
          text=once(text,anchor3,anchor3+extra3,"MariaDB readiness assertions")
          p.write_text(text)
          PY
          python3 /tmp/professor_p2.py
          php -l config/sharky-member-ops.php
          php -l config/sharky-member-routing.php
          php -l tests/sharky-member-ops-regression.php
          php -l tests/sharky-professor-coteaching-mariadb.php
          php tests/sharky-member-ops-regression.php
          rm -f .github/workflows/temp-profesor-review-p2.yml
          git config user.name "Hache Interactive"
          git config user.email "manglefurniture@gmail.com"
          git add -A
          git commit -m "fix: cerrar P2 de readiness de co-docencia"
          git push origin HEAD:fix/profesores-coteaching-review-p2-20260910