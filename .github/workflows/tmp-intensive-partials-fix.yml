name: Temp Intensive Partials Fix

on:
  push:
    branches:
      - feat/intensive-partial-payments-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intensive-partial-payments-20260909
          fetch-depth: 0
      - name: Apply reviewed partial-payment fixes
        run: |
          printf '%s' '' | base64 --decode > /tmp/fix-partials.py
          python3 /tmp/fix-partials.py
          php -l bin/intensive-partial-payment-triggers.php
          php -l bin/migrate-intensive-partial-payments.php
          php -l config/sharky-member-payments.php
          git config user.name 'Hache Interactive'
          git config user.email 'manglefurniture@gmail.com'
          git add -A ':!.github/workflows/tmp-intensive-partials-fix.yml'
          git commit -m 'fix: completar flujo de anticipos intensivos'
          git push origin HEAD:feat/intensive-partial-payments-20260909
