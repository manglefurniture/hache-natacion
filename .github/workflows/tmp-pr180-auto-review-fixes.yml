name: Temp PR180 Auto Review Fixes

on:
  push:
    branches:
      - feat/intensive-partial-payments-20260909

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intensive-partial-payments-20260909
          fetch-depth: 0
      - name: Apply automatic review fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          # P1: no dar acceso al intensivo hasta liquidar el precio completo.
          p=Path('config/reglas-acceso.php'); s=p.read_text()
          pattern=r"function regla_intensivo_pagado\(PDO \$pdo,string \$alumnoId,string \$sedeId,\?string \$cursoId=null,\?DateTimeImmutable \$referencia=null,\?string \$horarioId=null\): bool\n\{.*?\n\}\n\n(?=function regla_tiene_intensivo_activo)"
          replacement="""function regla_intensivo_pagado(PDO $pdo,string $alumnoId,string $sedeId,?string $cursoId=null,?DateTimeImmutable $referencia=null,?string $horarioId=null): bool
          {
              $where=[
                  'cia.alumno_id=:a',
                  'ci.sede_id=:s',
                  \"ci.estado IN ('PROGRAMADO','EN_CURSO')\",
              ];
              $params=[':a'=>$alumnoId,':s'=>$sedeId];
              if($cursoId!==null && $cursoId!==''){$where[]='ci.id=:c';$params[':c']=$cursoId;}
              if($horarioId!==null && $horarioId!==''){$where[]='cia.horario_id=:h';$params[':h']=$horarioId;}
              if($referencia!==null){$where[]=':f BETWEEN ci.fecha_inicio AND ci.fecha_fin';$params[':f']=$referencia->format('Y-m-d');}
              $sql=\"SELECT ci.id FROM curso_intensivo_alumnos cia
                  INNER JOIN cursos_intensivos ci ON ci.id=cia.curso_intensivo_id
                  LEFT JOIN pagos p ON p.intensivo_id=ci.id AND p.alumno_id=cia.alumno_id AND p.tipo='INTENSIVO' AND p.estado='VALIDO'
                  WHERE \".implode(' AND ',$where).\"
                  GROUP BY ci.id,ci.precio
                  HAVING COALESCE(SUM(p.importe),0)+0.009>=ci.precio
                  LIMIT 1\";
              $st=$pdo->prepare($sql);$st->execute($params);
              return (bool)$st->fetchColumn();
          }

          """
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('regla_intensivo_pagado patch failed')
          p.write_text(s2)

          # P2: Control de Alumnos distingue ANTICIPO de PAGADO y conserva Pagar saldo.
          old="(SELECT EXISTS(SELECT 1 FROM pagos pg WHERE pg.alumno_id=a.id AND pg.intensivo_id=ci.id AND pg.tipo='INTENSIVO' AND pg.estado='VALIDO') FROM curso_intensivo_alumnos cia INNER JOIN cursos_intensivos ci ON ci.id=cia.curso_intensivo_id WHERE cia.alumno_id=a.id AND ci.sede_id=a.sede_id AND ci.estado IN ('PROGRAMADO','EN_CURSO') ORDER BY ci.fecha_inicio DESC LIMIT 1) intensivo_pagado,"
          new="(SELECT COALESCE((SELECT SUM(pg.importe) FROM pagos pg WHERE pg.alumno_id=a.id AND pg.intensivo_id=ci.id AND pg.tipo='INTENSIVO' AND pg.estado='VALIDO'),0) FROM curso_intensivo_alumnos cia INNER JOIN cursos_intensivos ci ON ci.id=cia.curso_intensivo_id WHERE cia.alumno_id=a.id AND ci.sede_id=a.sede_id AND ci.estado IN ('PROGRAMADO','EN_CURSO') ORDER BY ci.fecha_inicio DESC LIMIT 1) intensivo_pagado_total,\n(SELECT CASE WHEN COALESCE((SELECT SUM(pg.importe) FROM pagos pg WHERE pg.alumno_id=a.id AND pg.intensivo_id=ci.id AND pg.tipo='INTENSIVO' AND pg.estado='VALIDO'),0)+0.009>=ci.precio THEN 1 ELSE 0 END FROM curso_intensivo_alumnos cia INNER JOIN cursos_intensivos ci ON ci.id=cia.curso_intensivo_id WHERE cia.alumno_id=a.id AND ci.sede_id=a.sede_id AND ci.estado IN ('PROGRAMADO','EN_CURSO') ORDER BY ci.fecha_inicio DESC LIMIT 1) intensivo_pagado,"
          replace_once('public/alumnos.php',old,new)
          replace_once('public/alumnos.php',"<?php foreach($intensivos as $a):$intPagado=(int)($a['intensivo_pagado']??0)===1;?>","<?php foreach($intensivos as $a):$intPagado=(int)($a['intensivo_pagado']??0)===1;$intPagadoTotal=(float)($a['intensivo_pagado_total']??0);$intSaldo=max(0.0,round((float)($a['intensivo_precio']??0)-$intPagadoTotal,2));$intAnticipo=!$intPagado&&$intPagadoTotal>0.009;?>")
          oldcell="<td><?php if($intPagado):?><span class=\"estado pagado-intensivo\">PAGADO</span><?php else:?><span class=\"estado pendiente-intensivo\">PENDIENTE DE PAGO</span><div><button type=\"button\" class=\"quick-pay intensive-pay\" data-quick-pay data-payment-type=\"INTENSIVO\" data-id=\"<?=e($a['id'])?>\" data-name=\"<?=e($a['nombre'])?>\" data-price=\"<?=e((string)($a['intensivo_precio']??0))?>\" data-course-id=\"<?=e((string)($a['intensivo_id']??''))?>\">Pagar curso</button></div><?php endif;?></td>"
          newcell="<td><?php if($intPagado):?><span class=\"estado pagado-intensivo\">PAGADO</span><?php else:?><?php if($intAnticipo):?><span class=\"estado pendiente-intensivo\">ANTICIPO $<?=number_format($intPagadoTotal,2)?></span><div class=\"secundario\">Saldo $<?=number_format($intSaldo,2)?></div><?php else:?><span class=\"estado pendiente-intensivo\">PENDIENTE DE PAGO</span><?php endif;?><div><button type=\"button\" class=\"quick-pay intensive-pay\" data-quick-pay data-payment-type=\"INTENSIVO\" data-id=\"<?=e($a['id'])?>\" data-name=\"<?=e($a['nombre'])?>\" data-price=\"<?=e((string)$intSaldo)?>\" data-course-id=\"<?=e((string)($a['intensivo_id']??''))?>\"><?=$intAnticipo?'Pagar saldo':'Pagar curso'?></button></div><?php endif;?></td>"
          replace_once('public/alumnos.php',oldcell,newcell)

          # P1: cada abono con tarjeta usa su propio external_reference, reutilizando solo un PENDING equivalente.
          oldext="""function hache_sharky_member_payment_external(string $studentId,string $kind,string $resourceId): string
          {
              $prefix=strtoupper($kind)==='MENSUALIDAD'?'m':'i';
              return 'sharky:member:'.$prefix.':'.substr(hash('sha256',$studentId.'|'.$kind.'|'.$resourceId),0,32);
          }
          """
          newext="""function hache_sharky_member_payment_external(string $studentId,string $kind,string $resourceId,int $installment=1): string
          {
              $prefix=strtoupper($kind)==='MENSUALIDAD'?'m':'i';
              $base='sharky:member:'.$prefix.':'.substr(hash('sha256',$studentId.'|'.$kind.'|'.$resourceId),0,32);
              if(strtoupper($kind)==='INTENSIVO'&&$installment>1)return $base.':'.$installment;
              return $base;
          }

          function hache_sharky_member_payment_checkout_external(PDO $pdo,array $pending): ?string
          {
              $studentId=trim((string)($pending['student_id']??''));$kind=strtoupper(trim((string)($pending['kind']??'')));$resourceId=trim((string)($pending['resource_id']??''));$base=(float)($pending['base']??0);
              if($studentId===''||$resourceId===''||$base<=0)return null;
              $root=hache_sharky_member_payment_external($studentId,$kind,$resourceId);
              if($kind!=='INTENSIVO')return $root;
              if(!hache_sharky_member_payments_schema_ready($pdo))return null;
              try{
                  $st=$pdo->prepare(\"SELECT external_reference FROM sharky_member_payment_intents WHERE alumno_id=:a AND payment_kind='INTENSIVO' AND intensivo_id=:i AND status='PENDING' AND ABS(base_amount-:b)<=0.009 ORDER BY created_at DESC LIMIT 1\");
                  $st->execute([':a'=>$studentId,':i'=>$resourceId,':b'=>number_format($base,2,'.','')]);$pendingExternal=trim((string)($st->fetchColumn()?:''));if($pendingExternal!=='')return $pendingExternal;
                  $st=$pdo->prepare(\"SELECT COUNT(*) FROM sharky_member_payment_intents WHERE alumno_id=:a AND payment_kind='INTENSIVO' AND intensivo_id=:i\");$st->execute([':a'=>$studentId,':i'=>$resourceId]);$installment=max(1,(int)$st->fetchColumn()+1);
                  return hache_sharky_member_payment_external($studentId,$kind,$resourceId,$installment);
              }catch(Throwable $e){error_log('[sharky-member-payment] external slot failed');return null;}
          }
          """
          replace_once('config/sharky-member-payments.php',oldext,newext)
          replace_once('config/sharky-member-payments.php',"$pct=is_numeric($business['sharky_recargo_tarjeta_pct']??null)?(float)$business['sharky_recargo_tarjeta_pct']:5.0;$pct=max(0.0,min(30.0,$pct));$charged=hache_sharky_mp_card_total($base,$pct);$external=hache_sharky_member_payment_external($studentId,$kind,$resourceId);","$pct=is_numeric($business['sharky_recargo_tarjeta_pct']??null)?(float)$business['sharky_recargo_tarjeta_pct']:5.0;$pct=max(0.0,min(30.0,$pct));$charged=hache_sharky_mp_card_total($base,$pct);$external=trim((string)($pending['external_reference']??''));if($external==='')$external=hache_sharky_member_payment_external($studentId,$kind,$resourceId);")
          replace_once('config/sharky-member-payments.php',"    $card=hache_sharky_member_payment_card_payload($contact,$pending,$business);\n","    $external=hache_sharky_member_payment_checkout_external($pdo,$pending);\n    if($external===null)return hache_sharky_member_payment_queue_owned($pdo,$contact,$event,'No pude preparar el pago con tarjeta en este momento. Puedes elegir efectivo o transferencia SPEI.','member-payment-external');\n    $pending['external_reference']=$external;\n    $card=hache_sharky_member_payment_card_payload($contact,$pending,$business);\n")

          # Regresiones: acceso solo al liquidar, quick pay conserva saldo, external distinto por abono.
          replace_once('tests/intensive-partial-payments-mariadb.php',"require_once __DIR__.'/../bin/intensive-partial-payment-triggers.php';","require_once __DIR__.'/../bin/intensive-partial-payment-triggers.php';\nrequire_once __DIR__.'/../config/reglas-acceso.php';")
          replace_once('tests/intensive-partial-payments-mariadb.php',"$pdo->exec(\"CREATE TABLE cursos_intensivos(id CHAR(36) PRIMARY KEY,precio DECIMAL(10,2) NOT NULL) ENGINE=InnoDB\");","$pdo->exec(\"CREATE TABLE cursos_intensivos(id CHAR(36) PRIMARY KEY,sede_id CHAR(36) NOT NULL,precio DECIMAL(10,2) NOT NULL,estado ENUM('PROGRAMADO','EN_CURSO','TERMINADO') NOT NULL,fecha_inicio DATE NOT NULL,fecha_fin DATE NOT NULL) ENGINE=InnoDB\");")
          replace_once('tests/intensive-partial-payments-mariadb.php',"$pdo->exec(\"CREATE TABLE pagos(id CHAR(36) PRIMARY KEY,alumno_id CHAR(36) NOT NULL,inscripcion_id CHAR(36) NULL,mensualidad_id CHAR(36) NULL,intensivo_id CHAR(36) NULL,tipo ENUM('INSCRIPCION','MENSUALIDAD','INTENSIVO') NOT NULL,importe DECIMAL(10,2) NOT NULL,estado ENUM('VALIDO','INVALIDO') NOT NULL DEFAULT 'VALIDO') ENGINE=InnoDB\");","$pdo->exec(\"CREATE TABLE curso_intensivo_alumnos(alumno_id CHAR(36) NOT NULL,curso_intensivo_id CHAR(36) NOT NULL,horario_id CHAR(36) NULL) ENGINE=InnoDB\");\n$pdo->exec(\"CREATE TABLE pagos(id CHAR(36) PRIMARY KEY,alumno_id CHAR(36) NOT NULL,inscripcion_id CHAR(36) NULL,mensualidad_id CHAR(36) NULL,intensivo_id CHAR(36) NULL,tipo ENUM('INSCRIPCION','MENSUALIDAD','INTENSIVO') NOT NULL,importe DECIMAL(10,2) NOT NULL,estado ENUM('VALIDO','INVALIDO') NOT NULL DEFAULT 'VALIDO') ENGINE=InnoDB\");")
          replace_once('tests/intensive-partial-payments-mariadb.php',"$pdo->prepare(\"INSERT INTO cursos_intensivos(id,precio) VALUES('course-1',1200.00)\")->execute();hache_intensive_partial_payment_apply($pdo);part_ok(hache_intensive_partial_payment_triggers_ready($pdo),'Los triggers nuevos deben quedar verificables');","$pdo->prepare(\"INSERT INTO cursos_intensivos(id,sede_id,precio,estado,fecha_inicio,fecha_fin) VALUES('course-1','sede-1',1200.00,'PROGRAMADO','2026-09-01','2026-09-30')\")->execute();$pdo->exec(\"INSERT INTO curso_intensivo_alumnos(alumno_id,curso_intensivo_id,horario_id) VALUES('student-1','course-1','horario-1')\");hache_intensive_partial_payment_apply($pdo);part_ok(hache_intensive_partial_payment_triggers_ready($pdo),'Los triggers nuevos deben quedar verificables');")
          replace_once('tests/intensive-partial-payments-mariadb.php',"$insert=$pdo->prepare(\"INSERT INTO pagos(id,alumno_id,intensivo_id,tipo,importe,estado) VALUES(:id,'student-1','course-1','INTENSIVO',:importe,'VALIDO')\");$insert->execute([':id'=>'p1',':importe'=>'600.00']);$insert->execute([':id'=>'p2',':importe'=>'600.00']);$sum=(float)$pdo->query(\"SELECT SUM(importe) FROM pagos WHERE alumno_id='student-1' AND intensivo_id='course-1' AND estado='VALIDO'\")->fetchColumn();part_ok(abs($sum-1200.0)<0.009,'Dos abonos de 600 deben liquidar un curso de 1200');","$insert=$pdo->prepare(\"INSERT INTO pagos(id,alumno_id,intensivo_id,tipo,importe,estado) VALUES(:id,'student-1','course-1','INTENSIVO',:importe,'VALIDO')\");$insert->execute([':id'=>'p1',':importe'=>'600.00']);part_ok(!regla_intensivo_pagado($pdo,'student-1','sede-1','course-1'),'Un anticipo de 600 no debe otorgar acceso a un curso de 1200');$insert->execute([':id'=>'p2',':importe'=>'600.00']);part_ok(regla_intensivo_pagado($pdo,'student-1','sede-1','course-1'),'El acceso debe habilitarse al liquidar los 1200');$sum=(float)$pdo->query(\"SELECT SUM(importe) FROM pagos WHERE alumno_id='student-1' AND intensivo_id='course-1' AND estado='VALIDO'\")->fetchColumn();part_ok(abs($sum-1200.0)<0.009,'Dos abonos de 600 deben liquidar un curso de 1200');")

          replace_once('tests/sharky-member-ops-regression.php',"$externalIntensive=hache_sharky_member_payment_external('student-1','INTENSIVO','course-1');","$externalIntensive=hache_sharky_member_payment_external('student-1','INTENSIVO','course-1');\n$externalIntensiveSecond=hache_sharky_member_payment_external('student-1','INTENSIVO','course-1',2);")
          replace_once('tests/sharky-member-ops-regression.php',"member_ok($externalMonthly!==$externalIntensive,'Monthly and intensive payments need separate external references.');","member_ok($externalMonthly!==$externalIntensive,'Monthly and intensive payments need separate external references.');\nmember_ok($externalIntensive!==$externalIntensiveSecond&&str_starts_with($externalIntensiveSecond,$externalIntensive.':'),'Each intensive installment needs a distinct deterministic external reference.');")
          replace_once('tests/sharky-member-ops-regression.php',"member_ok(str_contains($payments,'exceeds the remaining intensive balance'),'MP reconciliation must reject an overpayment race instead of blocking every second installment.');","member_ok(str_contains($payments,'exceeds the remaining intensive balance'),'MP reconciliation must reject an overpayment race instead of blocking every second installment.');\nmember_ok(str_contains($payments,'hache_sharky_member_payment_checkout_external'),'Card checkout must allocate a new intensive external reference after a reconciled installment.');")

          p=Path('tests/intensivo-payment-regressions.mjs'); s=p.read_text()
          s=s.replace("const deployImplementation = read('ops/production-readiness/deploy-hache-natacion');","const deployImplementation = read('ops/production-readiness/deploy-hache-natacion');\nconst accessRules = read('config/reglas-acceso.php');\nconst alumnosPage = read('public/alumnos.php');",1)
          marker="assert.ok(detailFlow.slice(paidBranch, payLink).includes('}else{'), 'Pagar debe quedar detrás del else del estado pagado');"
          addition=marker+"\n\n// Un anticipo no concede acceso y Control de Alumnos debe conservar el cobro del saldo.\nassert.match(accessRules, /HAVING COALESCE\\(SUM\\(p\\.importe\\),0\\)\\+0\\.009>=ci\\.precio/);\nassert.ok(alumnosPage.includes('intensivo_pagado_total'));\nassert.ok(alumnosPage.includes('ANTICIPO $'));\nassert.ok(alumnosPage.includes(\"$intAnticipo?'Pagar saldo':'Pagar curso'\"));"
          if marker not in s: raise SystemExit('intensivo regression marker missing')
          p.write_text(s.replace(marker,addition,1))
          PY

          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'Hache Interactive'
          git config user.email 'manglefurniture@gmail.com'
          git add config/reglas-acceso.php config/sharky-member-payments.php public/alumnos.php tests/intensive-partial-payments-mariadb.php tests/sharky-member-ops-regression.php tests/intensivo-payment-regressions.mjs
          git commit -m 'fix: cerrar hallazgos de abonos parciales'
          git push origin HEAD:feat/intensive-partial-payments-20260909
