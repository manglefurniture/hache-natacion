name: Fix PR211 Codex findings

on:
  push:
    branches:
      - fix/sharky-level-product-venue-priority

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow fixes and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text()
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}')
              p.write_text(text.replace(old,new,1))

          replace_once('config/sharky-product-boundary-guard.php', """function hache_sharky_product_boundary_sanitize_state(array $state,string $userText=''): array
          {
              if(!is_array($state['commercial_context']??null))$state['commercial_context']=[];
              $c=&$state['commercial_context'];
              if(($c['swim_level']??null)==='swims'&&($c['background']??null)==='formal'){
                  $c['recommended_program']='regular';
                  $c['program']='regular';
                  foreach(['course_id','fecha_inicio','course_price','date_preference'] as $key)unset($c[$key]);
                  return $state;
              }
              if(!hache_sharky_product_boundary_regular_restricted($state,$userText))return $state;
              if($userText!==''&&hache_sharky_product_boundary_no_formal_signal($userText))$c['background']='no_formal';
              $c['recommended_program']='intensive';
              $c['program']='intensive';
              foreach(['plan_id','plan_name','sessions_per_week','plan_price'] as $key)unset($c[$key]);
              return $state;
          }
          """, """function hache_sharky_product_boundary_sanitize_state(array $state,string $userText=''): array
          {
              if(!is_array($state['commercial_context']??null))$state['commercial_context']=[];
              $c=&$state['commercial_context'];
              $currentNoFormal=$userText!==''&&hache_sharky_product_boundary_no_formal_signal($userText);
              if($currentNoFormal)$c['background']='no_formal';
              if(($c['swim_level']??null)==='swims'&&($c['background']??null)==='formal'){
                  $c['recommended_program']='regular';
                  $c['program']='regular';
                  foreach(['course_id','fecha_inicio','course_price','date_preference'] as $key)unset($c[$key]);
                  return $state;
              }
              if(!hache_sharky_product_boundary_regular_restricted($state,$userText))return $state;
              $c['recommended_program']='intensive';
              $c['program']='intensive';
              foreach(['plan_id','plan_name','sessions_per_week','plan_price'] as $key)unset($c[$key]);
              return $state;
          }
          """)

          replace_once('config/sharky-whatsapp-adapter.php', """function hache_sharky_whatsapp_apply_swim_level_choice(array $state,string $level): array
          {
              if(!in_array($level,['beginner','swims'],true))return $state;
              $state['commercial_context']['swim_level']=$level;
              if($level==='beginner'&&($state['commercial_context']['program']??null)===null)$state['commercial_context']['program']='intensive';
              return $state;
          }
          """, """function hache_sharky_whatsapp_apply_swim_level_choice(array $state,string $level): array
          {
              if(!in_array($level,['beginner','swims'],true))return $state;
              $state['commercial_context']['swim_level']=$level;
              if($level==='beginner'){
                  $state['commercial_context']['program']='intensive';
                  $state['commercial_context']['recommended_program']='intensive';
                  unset($state['commercial_context']['background']);
                  foreach(['plan_id','plan_name','sessions_per_week','plan_price'] as $key)unset($state['commercial_context'][$key]);
              }
              return $state;
          }
          """)

          replace_once('tests/sharky-product-boundary-regression.php', """$formalClean=hache_sharky_product_boundary_sanitize_state($formal);
          product_boundary_ok(($formalClean['commercial_context']['program']??null)==='regular','Formal swimmer state must canonicalize to regular classes automatically.');
          product_boundary_ok(($formalClean['commercial_context']['recommended_program']??null)==='regular','Formal swimmer recommendation must canonicalize to regular classes.');

          $dirty=$beginner;
          """, """$formalClean=hache_sharky_product_boundary_sanitize_state($formal);
          product_boundary_ok(($formalClean['commercial_context']['program']??null)==='regular','Formal swimmer state must canonicalize to regular classes automatically.');
          product_boundary_ok(($formalClean['commercial_context']['recommended_program']??null)==='regular','Formal swimmer recommendation must canonicalize to regular classes.');

          $staleFormal=$formal;
          $staleFormal['commercial_context']=array_replace($staleFormal['commercial_context'],[
              'program'=>'regular','recommended_program'=>'regular','plan_id'=>'r3','plan_name'=>'Regular 3','sessions_per_week'=>3,'plan_price'=>1000,
          ]);
          $staleFormal=hache_sharky_product_boundary_sanitize_state($staleFormal,'Nado un poco pero nunca he tomado clases');
          product_boundary_ok(($staleFormal['commercial_context']['background']??null)==='no_formal','Current no-formal evidence must overwrite stale formal history in durable state.');
          product_boundary_ok(($staleFormal['commercial_context']['program']??null)==='intensive','Current no-formal evidence must persist the intensive restriction instead of returning early as regular.');
          product_boundary_ok(($staleFormal['commercial_context']['recommended_program']??null)==='intensive','Current no-formal evidence must persist the intensive recommendation.');
          product_boundary_ok(!isset($staleFormal['commercial_context']['plan_id']),'Current no-formal evidence must discard stale regular-plan state.');
          $staleFormalFollowup=hache_sharky_product_boundary_sanitize_state($staleFormal,'¿Qué planes hay?');
          product_boundary_ok(($staleFormalFollowup['commercial_context']['program']??null)==='intensive','A later turn without repeated contradiction must remain intensive after current no-formal evidence was persisted.');

          $dirty=$beginner;
          """)

          replace_once('tests/sharky-qualification-priority-regression.php', """priority_ok(array_column($beginnerDecision['ui']['buttons']??[],'id')===['sede:monteverde','sede:palapas'],'Venue proposal must keep Palapas as the immediate alternative.');

          [$palapas,$palapasDecision]=hache_sharky_whatsapp_qualification_input($pdo,$beginner,[
          """, """priority_ok(array_column($beginnerDecision['ui']['buttons']??[],'id')===['sede:monteverde','sede:palapas'],'Venue proposal must keep Palapas as the immediate alternative.');

          $staleRegular=$fresh;
          $staleRegular['commercial_context']=array_replace($staleRegular['commercial_context'],[
              'program'=>'regular','recommended_program'=>'regular','background'=>'formal','plan_id'=>'r3','plan_name'=>'Regular 3','sessions_per_week'=>3,'plan_price'=>1000,
          ]);
          $staleRegular=hache_sharky_orchestrator_flow($staleRegular,'qualify_prospect','swim',[],$now+5);
          [$staleBeginner,$staleBeginnerDecision]=hache_sharky_whatsapp_qualification_input($pdo,$staleRegular,[
              'text'=>'Desde cero','interactive_id'=>'qualify:beginner',
          ],$now+6,12);
          priority_ok(($staleBeginner['commercial_context']['swim_level']??null)==='beginner','A new beginner selection must become authoritative even over stale pre-qualification context.');
          priority_ok(($staleBeginner['commercial_context']['program']??null)==='intensive','A beginner selection must overwrite a stale regular program before advancing.');
          priority_ok(($staleBeginner['commercial_context']['recommended_program']??null)==='intensive','A beginner selection must overwrite a stale regular recommendation.');
          priority_ok(!isset($staleBeginner['commercial_context']['background']),'A beginner selection must invalidate stale formal-history context.');
          priority_ok(!isset($staleBeginner['commercial_context']['plan_id']),'A beginner selection must discard stale regular-plan state.');
          priority_ok(($staleBeginner['flow']['step']??null)==='sede','Repaired beginner state must continue only to venue selection.');
          priority_ok(($staleBeginner['flow']['data']['venue_proposal']??null)==='MONTEVERDE','Repaired beginner state must retain the Monteverde-first venue rule.');
          priority_ok(array_column($staleBeginnerDecision['ui']['buttons']??[],'id')===['sede:monteverde','sede:palapas'],'Repaired beginner state must expose only venue controls, never regular-product continuation.');

          [$palapas,$palapasDecision]=hache_sharky_whatsapp_qualification_input($pdo,$beginner,[
          """)
          PY
      - name: Syntax
        run: |
          php -l config/sharky-product-boundary-guard.php
          php -l config/sharky-whatsapp-adapter.php
          php -l tests/sharky-product-boundary-regression.php
          php -l tests/sharky-qualification-priority-regression.php
      - name: Focused regressions
        run: |
          php tests/sharky-product-boundary-regression.php
          php tests/sharky-qualification-priority-regression.php
          php tests/sharky-guided-onboarding-regression.php
          php tests/sharky-pr162-review-regression.php
          php tests/sharky-commercial-memory-regression.php
      - name: Full suite
        run: npm test
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sharky-product-boundary-guard.php config/sharky-whatsapp-adapter.php tests/sharky-product-boundary-regression.php tests/sharky-qualification-priority-regression.php
          git diff --cached --check
          git commit -m "Address PR211 Codex qualification findings"
          git push origin HEAD:fix/sharky-level-product-venue-priority
