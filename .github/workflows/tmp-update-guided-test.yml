name: Temporary guided test update
on:
  push:
    branches: [fix/sharky-commercial-next-action-20260903]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sharky-commercial-next-action-20260903
      - name: Update exact expectation and remove temporary workflow
        run: |
          python3 -c "from pathlib import Path; p=Path('tests/sharky-guided-onboarding-regression.php'); s=p.read_text(); old=\"(\$knownIntensiveDecision['kind']??null)==='commercial_ready'\"; new=\"(\$knownIntensiveDecision['kind']??null)==='commercial_next_action'\"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"
          rm .github/workflows/tmp-update-guided-test.yml
          git config user.name "Hache Interactive Automation"
          git config user.email "manglefurniture@gmail.com"
          git add tests/sharky-guided-onboarding-regression.php .github/workflows/tmp-update-guided-test.yml
          git commit -m "test: expect deterministic commercial next action"
          git push origin HEAD:fix/sharky-commercial-next-action-20260903
