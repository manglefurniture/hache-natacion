name: Salad read-only diagnostic of group ocho

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/salad-ocho-diagnostic-once.yml
  pull_request:
    paths:
      - .github/workflows/salad-ocho-diagnostic-once.yml
      - ops/salad-discover-ocho.mjs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --check ops/salad-discover-ocho.mjs

  discover:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read-only search for exact Salad group
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
        run: node ops/salad-discover-ocho.mjs
