name: Temporary Sharky runtime decoupling

on:
  push:
    branches:
      - feat/sharky-intensivo-info-form

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sharky-intensivo-info-form
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply decoupling and run regressions
        run: |
          python .tmp-fix-sharky-runtime-coupling.py
          php -l config/sharky-whatsapp-adapter.php
          php tests/sharky-commercial-next-action-regression.php
          php tests/sharky-war-games-regression.php
          php tests/sharky-batch-context-regression.php
          php tests/sharky-guided-onboarding-regression.php
          php tests/sharky-followup-regression.php
          npm test
          rm -f .tmp-fix-sharky-runtime-coupling.py .github/workflows/tmp-fix-sharky-runtime-coupling.yml
          git config user.name "Hache Interactive"
          git config user.email "manglefurniture@gmail.com"
          git add -A
          git commit -m "fix: desacoplar consulta intensiva del runtime de Sharky"
          git push origin HEAD:feat/sharky-intensivo-info-form
