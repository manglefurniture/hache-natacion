name: Sharky Context Drift Implementation

on:
  push:
    branches:
      - fix/sharky-context-drift-20260903

permissions:
  contents: write

jobs:
  implement-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sharky-context-drift-20260903
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply controlled context-drift patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/sharky-context-drift-apply.py')
          s=p.read_text(encoding='utf-8')
          bad="$words=preg_split('/\\s+/u,$plain,-1,PREG_SPLIT_NO_EMPTY)?:[];"
          good="$words=preg_split('/\\s+/u',$plain,-1,PREG_SPLIT_NO_EMPTY)?:[];"
          if bad not in s:
              raise SystemExit('patch harness syntax anchor missing')
          p.write_text(s.replace(bad,good,1),encoding='utf-8')
          PY
          python3 tools/sharky-context-drift-apply.py
      - name: PHP syntax on touched files
        run: |
          php -l config/sharky-whatsapp-adapter.php
          php -l config/sharky-orchestrator.php
          php -l tests/sharky-context-drift-regression.php
      - name: Screenshot regressions
        run: php tests/sharky-context-drift-regression.php
      - name: Existing focused Sharky regressions
        run: |
          php tests/sharky-whatsapp-adapter-regression.php
          php tests/sharky-guided-onboarding-regression.php
          php tests/sharky-commercial-next-action-regression.php
          php tests/sharky-deterministic-replies-regression.php
          php tests/sharky-post-pr72-regression.php
      - name: Full quality suite
        run: npm test
      - name: Commit tested implementation
        run: |
          git config user.name 'Hache Interactive'
          git config user.email 'manglefurniture@gmail.com'
          git add config package.json tests
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit.'
            exit 0
          fi
          git commit -m 'fix: keep Sharky inside the commercial conversation state'
          git push origin HEAD:fix/sharky-context-drift-20260903
