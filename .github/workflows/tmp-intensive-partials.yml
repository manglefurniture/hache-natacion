name: Temp Intensive Partials Patch

on:
  push:
    branches:
      - feat/intensive-partial-payments-20260909

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/intensive-partial-payments-20260909
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Apply non-workflow implementation
        env:
          PATCH_SOURCE_SHA: fd472f2090a2fdf6a9c0c9582455001d77cce59c
        run: |
          git show "$PATCH_SOURCE_SHA:.github/workflows/tmp-intensive-partials.yml" > /tmp/partial-source.yml
          python3 - <<'PY'
          from pathlib import Path
          source=Path('/tmp/partial-source.yml').read_text()
          marker="          python3 - <<'PY'\n"
          start=source.index(marker)+len(marker)
          end=source.index("\n          PY",start)
          block=source[start:end]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-partials.py').write_text('\n'.join(lines)+'\n')
          PY
          python3 /tmp/apply-partials.py
          git checkout HEAD -- .github/workflows/deploy.yml .github/workflows/quality.yml .github/workflows/tmp-intensive-partials.yml
          php -l config/intensive-partial-payment-triggers.php
          php -l bin/migrate-intensive-partial-payments.php
          php -l tests/intensive-partial-payments-mariadb.php
          git config user.name 'Hache Interactive'
          git config user.email 'manglefurniture@gmail.com'
          git add -A
          git commit -m 'feat: soportar abonos parciales en intensivos'
          git push origin HEAD:feat/intensive-partial-payments-20260909
