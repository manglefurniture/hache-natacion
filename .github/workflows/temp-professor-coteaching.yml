name: Temp professor co-teaching patch

on:
  push:
    branches: [feat/profesor-coteaching-20260909]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profesor-coteaching-20260909
          fetch-depth: 2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Replay implementation without workflow mutations
        run: |
          git show HEAD^:.github/workflows/temp-professor-coteaching.yml > /tmp/previous.yml
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/previous.yml').read_text().splitlines()
          marker='        run: |'
          idx=lines.index(marker)+1
          body=[]
          for line in lines[idx:]:
              body.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(body)+'\n'
          script=script.replace('rm -f .github/workflows/temp-professor-coteaching.yml','git checkout -- .github/workflows/quality.yml\n# El workflow temporal se elimina después con el conector de GitHub.')
          Path('/tmp/replay.sh').write_text(script)
          PY
          bash /tmp/replay.sh
