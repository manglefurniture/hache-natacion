name: Temporary pending payment priority

on:
  push:
    branches: [fix/sharky-pending-payment-priority]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sharky-pending-payment-priority
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Gate
        id: gate
        run: |
          if git log -1 --pretty=%B | grep -Fq '[pending-payment-priority]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply pending-payment priority changes
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          ops = 'config/sharky-member-ops.php'
          replace_once(ops,
              "    if($id==='member:payments'||$id==='member:pay')return 'payments';",
              "    if($id==='member:payments'||$id==='member:pay'||str_starts_with($id,'member:pay:'))return 'payments';")

          routing = 'config/sharky-member-routing.php'
          marker = "function hache_sharky_member_teacher_owned_event(array $teacher,?array $flow,array $event,?string $intent=null): bool\n{"
          helper = r'''function hache_sharky_member_pending_payment_payload(string $contact,array $student): ?array
          {
              if(!hache_sharky_member_pending_registration($student))return null;
              $pending=hache_sharky_member_payment_pending_from_context($student);if(!is_array($pending))return null;
              $payment=$student['payment']??null;if(!is_array($payment)||($payment['pending']??false)!==true)return null;
              $due=(float)($payment['due']??0);if($due<=0.009)return null;
              $first=function_exists('hache_sharky_member_first_name')?hache_sharky_member_first_name($student):'';
              $program=($payment['kind']??'')==='intensive'?'tu inscripción al curso intensivo':'tu inscripción';
              $amount='$'.number_format($due,2,'.',',').' MXN';
              $body='¡Hola'.($first!==''?', '.$first:'').'! 😊 '.$program.' sigue pendiente de pago. 💰 Tienes '.$amount.' pendientes. ¿Deseas pagar ahora o cambiar la forma de pago que habías elegido?';
              return hache_sharky_member_buttons($contact,$body,[['id'=>'member:pay','title'=>'Pagar ahora']]);
          }

          '''
          replace_once(routing, marker, helper + marker)

          old_pending = r'''        if(hache_sharky_member_pending_registration($student)){
              $body=hache_sharky_member_pending_message($student,$text,$intent);
              $payload=hache_sharky_whatsapp_text_payload($contact,$body);
              return hache_sharky_member_queue($pdo,$contact,$event,$state,$payload,'student-pending');
          }
          '''
          new_pending = r'''        if(hache_sharky_member_pending_registration($student)){
              if(!hache_sharky_member_pending_schedule_problem($text)){
                  $paymentPayload=hache_sharky_member_pending_payment_payload($contact,$student);
                  if(is_array($paymentPayload))return hache_sharky_member_queue($pdo,$contact,$event,$state,$paymentPayload,'student-pending-payment');
              }
              $body=hache_sharky_member_pending_message($student,$text,$intent);
              $payload=hache_sharky_whatsapp_text_payload($contact,$body);
              return hache_sharky_member_queue($pdo,$contact,$event,$state,$payload,'student-pending');
          }
          '''
          replace_once(routing, old_pending, new_pending)

          payments = 'config/sharky-member-payments.php'
          old_method = r'''    if($id==='member:pay'){
              $pct=is_numeric($business['sharky_recargo_tarjeta_pct']??null)?(float)$business['sharky_recargo_tarjeta_pct']:5.0;
              return hache_sharky_member_payment_queue_payload_owned($pdo,$contact,$event,hache_sharky_member_payment_method_payload($contact,$pct),'member-payment-method');
          }
          '''
          new_method = r'''    if($id==='member:pay'){
              // Starting/restarting payment-method selection cancels only a stale SPEI
              // evidence wait. It does not alter the debt, registration or other member flows.
              $state=hache_sharky_member_payment_current_state($pdo,$contact);$flow=hache_sharky_member_flow($state);
              if(is_array($flow)&&($flow['name']??'')==='member_payment_transfer')$state=hache_sharky_member_set_flow($state,null,time());
              $pct=is_numeric($business['sharky_recargo_tarjeta_pct']??null)?(float)$business['sharky_recargo_tarjeta_pct']:5.0;
              return hache_sharky_member_payment_queue_payload_owned($pdo,$contact,$event,hache_sharky_member_payment_method_payload($contact,$pct),'member-payment-method',$state);
          }
          '''
          replace_once(payments, old_method, new_method)

          test = 'tests/sharky-member-ops-regression.php'
          replace_once(test,
              "require_once __DIR__.'/../config/sharky-member-payments.php';\n",
              "require_once __DIR__.'/../config/sharky-member-payments.php';\nrequire_once __DIR__.'/../config/sharky-member-routing.php';\n")
          replace_once(test,
              "member_eq(hache_sharky_member_intent('¿Cuánto debo de mensualidad?'),'payments','Payment questions must be deterministic.');\n",
              "member_eq(hache_sharky_member_intent('¿Cuánto debo de mensualidad?'),'payments','Payment questions must be deterministic.');\nmember_eq(hache_sharky_member_intent('','member:pay'),'payments','Pay-now button must stay in the deterministic payment lane.');\nmember_eq(hache_sharky_member_intent('','member:pay:transfer'),'payments','Payment-method buttons must stay in the deterministic payment lane.');\n")
          pending_tests = r'''$pendingRegistration=[
              'identity'=>['name'=>'Juan Pérez','student_id'=>'student-1'],
              'student'=>['estado_administrativo'=>'PENDIENTE'],
              'program'=>'intensive',
              'payment'=>['kind'=>'intensive','course_id'=>'course-1','price'=>1200.0,'paid'=>0.0,'due'=>1200.0,'pending'=>true],
          ];
          $pendingPaymentPayload=hache_sharky_member_pending_payment_payload('529981234567',$pendingRegistration);
          member_ok(is_array($pendingPaymentPayload),'An unpaid pending registration must expose a payment-first prompt.');
          $pendingPaymentText=(string)($pendingPaymentPayload['interactive']['body']['text']??'');
          member_ok(str_contains($pendingPaymentText,'$1,200.00 MXN')&&str_contains($pendingPaymentText,'curso intensivo'),'Pending intensive prompt must show the real balance and program.');
          member_eq($pendingPaymentPayload['interactive']['action']['buttons'][0]['reply']['id']??null,'member:pay','Pending registration must offer one direct Pagar ahora button.');
          member_ok(hache_sharky_member_pending_schedule_problem('Ese horario se me complica'),'Schedule questions must remain available instead of being trapped in payment.');

          '''
          replace_once(test, "$classCtx=[\n", pending_tests + "$classCtx=[\n")
          replace_once(test,
              "member_ok(str_contains($payments,\"is_array(\\$event['member_payment']??null)\"),'Transfer proof must be consumed by the registered-student payment processor.');\n",
              "member_ok(str_contains($payments,\"is_array(\\$event['member_payment']??null)\"),'Transfer proof must be consumed by the registered-student payment processor.');\nmember_ok(str_contains($payments,\"($flow['name']??'')==='member_payment_transfer'\"),'Pagar ahora must clear a stale SPEI evidence wait before changing payment method.');\nmember_ok(str_contains($payments,\"'member-payment-method',$state\"),'Payment-method restart must persist the cleaned member state.');\nmember_ok(str_contains($memberRouter,'hache_sharky_member_pending_payment_payload'),'Pending registrations must prioritize the payment CTA without changing Palapas restrictions.');\n")
          PY
      - name: Validate targeted regressions
        if: steps.gate.outputs.skip != 'true'
        run: |
          php -l config/sharky-member-ops.php
          php -l config/sharky-member-payments.php
          php -l config/sharky-member-routing.php
          php tests/sharky-member-ops-regression.php
          php tests/sharky-member-routing-midnight-regression.php
          php tests/sharky-entry-palapas-email-regression.php
      - name: Commit fixes
        if: steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "Hache Interactive"
          git config user.email "manglefurniture@gmail.com"
          git add config/sharky-member-ops.php config/sharky-member-payments.php config/sharky-member-routing.php tests/sharky-member-ops-regression.php
          git commit -m "fix: priorizar pago pendiente al retomar Sharky [pending-payment-priority]"
          git push origin HEAD:fix/sharky-pending-payment-priority
