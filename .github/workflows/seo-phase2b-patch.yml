name: SEO Phase 2B Patch

on:
  push:
    branches:
      - seo/fase-2b-programas-20260824

permissions:
  contents: write

jobs:
  apply-seo-programas:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Aplicar cambios SEO controlados
        run: node bin/apply-seo-programas-phase2b.mjs

      - name: Ejecutar regresiones
        run: npm test

      - name: Consolidar cambios y retirar automatización temporal
        run: |
          rm -f bin/apply-seo-programas-phase2b.mjs .github/workflows/seo-phase2b-patch.yml
          git config user.name "Hache Interactive"
          git config user.email "manglefurniture@gmail.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "SEO: alinear H1 y enlaces de páginas de programa"
          git push
