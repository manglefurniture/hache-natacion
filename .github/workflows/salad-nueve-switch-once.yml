name: 'Salad - GPU NUEVE RTX 4090 once'

on:
  pull_request:
    paths:
      - .github/workflows/salad-nueve-switch-once.yml
      - ops/salad-nueve-switch-once.mjs
      - tests/salad-nueve-switch-once.test.mjs
  push:
    branches: [main]
    paths:
      - .github/workflows/salad-nueve-switch-once.yml

permissions:
  contents: read

concurrency:
  group: salad-prl-gpu-changes
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check and test
        run: |
          node --check ops/salad-nueve-switch-once.mjs
          node --test tests/salad-nueve-switch-once.test.mjs tests/salad-gpu-switch-regression.mjs

  apply-once:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Change NUEVE GPU only
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
        run: node ops/salad-nueve-switch-once.mjs
