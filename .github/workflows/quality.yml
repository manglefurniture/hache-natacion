name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Static regressions and JavaScript syntax
        run: npm test
      - name: Production readiness pilot regression
        run: node tests/production-readiness-pilot-regression.mjs
