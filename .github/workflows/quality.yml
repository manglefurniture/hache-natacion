name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Static regressions and JavaScript syntax
        run: npm test
      - name: Sharky conversational Brain experiment regression
        run: php tests/sharky-brain-conversational-experiment-regression.php
      - name: Sharky Brain human edge regression
        run: php tests/sharky-brain-human-edges-regression.php
      - name: Sharky schedule scope guard regression
        run: php tests/sharky-schedule-scope-guard-regression.php
      - name: Sharky product boundary regression
        run: php tests/sharky-product-boundary-regression.php
      - name: Sharky field context regression
        run: php tests/sharky-field-context-regression.php
      - name: Sharky emergency Brain disable regression
        run: php tests/sharky-emergency-brain-disable-regression.php
      - name: Sharky Brain reactivation regression
        run: php tests/sharky-brain-reactivation-regression.php
      - name: Sharky Brain numeric context regression
        run: php tests/sharky-brain-numeric-context-regression.php
      - name: Sharky contact book regression
        run: php tests/sharky-contact-book-regression.php
      - name: Sharky WhatsApp template notifications regression
        run: php tests/sharky-template-notifications-regression.php
      - name: Sharky 48h prospect re-engagement regression
        run: php tests/sharky-reengagement-48h-regression.php
      - name: Sharky member routing and midnight takeover regression
        run: php tests/sharky-member-routing-midnight-regression.php
      - name: Sharky entry, Palapas red light and registration email regression
        run: php tests/sharky-entry-palapas-email-regression.php
      - name: Production readiness pilot regression
        run: node tests/production-readiness-pilot-regression.mjs
      - name: Production readiness RUM regression
        run: node tests/production-readiness-rum-regression.mjs
      - name: Production RUM build marker regression
        run: php tests/production-rum-build-marker-regression.php
      - name: Deploy wrapper permissions regression
        run: node tests/deploy-wrapper-permissions-regression.mjs
      - name: Ops field evidence one-shot regression
        run: node tests/ops-field-evidence-once-regression.mjs
      - name: Production real-backup restore ops regression
        run: node tests/production-readiness-restore-ops-regression.mjs
      - name: Production backup cadence regression
        run: node tests/production-backup-cadence-regression.mjs

  delivery-status-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hache_delivery_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: Delivery status MariaDB regression
        env:
          DELIVERY_DB_HOST: 127.0.0.1
          DELIVERY_DB_PORT: 3306
          DELIVERY_DB_NAME: hache_delivery_test
          DELIVERY_DB_USER: root
          DELIVERY_DB_PASS: root
        run: php tests/sharky-delivery-status-mariadb.php
      - name: Sharky member ops MariaDB regression
        env:
          DELIVERY_DB_HOST: 127.0.0.1
          DELIVERY_DB_PORT: 3306
          DELIVERY_DB_NAME: hache_delivery_test
          DELIVERY_DB_USER: root
          DELIVERY_DB_PASS: root
        run: php tests/sharky-member-ops-mariadb.php
      - name: Sharky professor co-teaching MariaDB regression
        env:
          DELIVERY_DB_HOST: 127.0.0.1
          DELIVERY_DB_PORT: 3306
          DELIVERY_DB_NAME: hache_delivery_test
          DELIVERY_DB_USER: root
          DELIVERY_DB_PASS: root
        run: php tests/sharky-professor-coteaching-mariadb.php
      - name: Sharky contact book MariaDB regression
        env:
          DELIVERY_DB_HOST: 127.0.0.1
          DELIVERY_DB_PORT: 3306
          DELIVERY_DB_NAME: hache_delivery_test
          DELIVERY_DB_USER: root
          DELIVERY_DB_PASS: root
        run: php tests/sharky-contact-book-mariadb.php
      - name: Intensive partial payments MariaDB regression
        env:
          DELIVERY_DB_HOST: 127.0.0.1
          DELIVERY_DB_PORT: 3306
          DELIVERY_DB_NAME: hache_delivery_test
          DELIVERY_DB_USER: root
          DELIVERY_DB_PASS: root
        run: php tests/intensive-partial-payments-mariadb.php
      - name: Production readiness RUM MariaDB regression
        env:
          DELIVERY_DB_HOST: 127.0.0.1
          DELIVERY_DB_PORT: 3306
          DELIVERY_DB_NAME: hache_delivery_test
          DELIVERY_DB_USER: root
          DELIVERY_DB_PASS: root
        run: php tests/production-readiness-rum-mariadb.php
