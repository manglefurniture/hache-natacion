name: Patch Sharky level product venue rules

on:
  push:
    branches:
      - fix/sharky-level-product-venue-priority

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow Sharky patch
        run: python .github/scripts/patch_sharky_priority.py
      - name: Syntax and focused regressions
        run: |
          php -l config/sharky-whatsapp-adapter.php
          php -l config/sharky-commercial-memory.php
          php -l config/sharky-product-boundary-guard.php
          php -l config/sharky-post-pr72.php
          php -l tests/sharky-qualification-priority-regression.php
          php tests/sharky-qualification-priority-regression.php
          php tests/sharky-pr162-review-regression.php
          php tests/sharky-product-boundary-regression.php
          php tests/sharky-guided-onboarding-regression.php
          php tests/sharky-commercial-memory-regression.php
      - name: Full regression suite
        run: npm test
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sharky-whatsapp-adapter.php config/sharky-commercial-memory.php config/sharky-product-boundary-guard.php config/sharky-post-pr72.php docs/SHARKY-POSITIVE-PATTERNS.md tests/sharky-pr162-review-regression.php tests/sharky-product-boundary-regression.php package.json
          git diff --cached --check
          git commit -m "Enforce Sharky level product and venue priorities"
          git push origin HEAD:fix/sharky-level-product-venue-priority
