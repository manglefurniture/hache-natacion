name: Salad Quantus read-only discovery

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/salad-quantus-discover.yml"

permissions:
  contents: read

jobs:
  discover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'exp/quantus-salad-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query sanitized Salad group inventory (read-only)
        env:
          SALAD_API_KEY: ${{ secrets.SALAD_API_KEY }}
        run: |
          node <<'JS'
          const key = process.env.SALAD_API_KEY || '';
          if (!key) throw new Error('Salad key not available in GitHub Actions.');
          const base='https://api.salad.com/api/public';
          async function get(path) {
            const r=await fetch(base+path,{
              headers:{'Salad-Api-Key':key,Accept:'application/json'},
              signal:AbortSignal.timeout(20000),
            });
            if(!r.ok)throw new Error('Salad discovery failed HTTP '+r.status);
            return r.json();
          }
          function list(obj) {
            if(Array.isArray(obj))return obj;
            for(const k of ['items','container_groups','containerGroups','groups'])
              if(Array.isArray(obj?.[k]))return obj[k];
            return [];
          }
          (async()=>{
            const org='interactive';
            // Salad's public API does not expose GET /organizations/{org}/projects.
            // Validate the organization with quotas, then inspect only likely project slugs.
            const possibleProjects=['default','prl-tests','prl-test'];
            const projects=[];
            const gpuCatalog=list(await get('/organizations/'+org+'/gpu-classes'));
            const candidateGpus=gpuCatalog.filter(x=>/4070 ti super/i.test(x.name||''))
              .map(x=>({id:x.id,name:x.name,prices:x.prices,fields:Object.keys(x)}));
            console.log('READ_ONLY_QTC_GPU_CLASSES',JSON.stringify({count:candidateGpus.length,candidates:candidateGpus}));
            const pearlTemplate=await get('/organizations/hache/projects/prl-tests/containers/prl-low-4070-experimental');
            console.log('READ_ONLY_PRL_TEMPLATE',JSON.stringify({priority:pearlTemplate.priority,
              replicas:pearlTemplate.replicas,autostart_policy:pearlTemplate.autostart_policy,
              restart_policy:pearlTemplate.restart_policy,group_fields:Object.keys(pearlTemplate),
              container_fields:Object.keys(pearlTemplate.container||{}),
              resources:pearlTemplate.container?.resources,
              env_names:Array.isArray(pearlTemplate.container?.environment_variables) ? pearlTemplate.container.environment_variables.map(v=>v.key||v.name) : Object.keys(pearlTemplate.container?.environment_variables||{}),
              registry_keys:Object.keys(pearlTemplate.container?.image_authentication||{})
            }));
            const quota=await get('/organizations/'+org+'/quotas');
            const groupQuota=quota.container_group_quotas||quota.container_groups_quotas||{};
            console.log('READ_ONLY_QUOTAS',JSON.stringify({fields:Object.keys(quota),group_quotas:groupQuota}));
            let project=null,groups=[];
            for(const candidate of possibleProjects) {
              const endpoint='/organizations/'+org+'/projects/'+candidate+'/containers';
              let response;
              try {response=await get(endpoint);}
              catch(e) {if(String(e.message||'').includes('HTTP 404'))continue;throw e;}
              project=candidate;groups=list(response);projects.push(candidate);break;
            }
            console.log('READ_ONLY_PROJECTS',JSON.stringify({organization:org,projects,matched:project}));
            if(!project)throw new Error('Organization quota works but no known project slug was found.');
            if(!Array.isArray(groups))throw new Error('Groups response invalid.');
            const safe=groups.map(g=>({
              name:String(g.name||'').slice(0,80),
              priority:g.priority,
              replicas:g.replicas,
              pending_change:g.pending_change,
              state:g.current_state?.status??null,
              gpu_classes:g.container?.resources?.gpu_classes??[],
              image:(g.container?.image||'').replace(/@sha256:[a-f0-9]+/i,'@digest').slice(0,160),
            })).sort((a,b)=>a.name.localeCompare(b.name));
            console.log('READ_ONLY_SALAD_DISCOVERY',JSON.stringify({organization:org,project,count:safe.length,groups:safe}));
          })().catch(e=>{console.error('READ_ONLY_DISCOVERY_FAILED',e.message);process.exitCode=1});
          JS
