name: Production Restore Drill

on:
  workflow_dispatch:
    inputs:
      rpo_seconds:
        description: Approved RPO in seconds (explicit, no default)
        required: true
        type: string
      rto_seconds:
        description: Approved RTO in seconds (explicit, no default)
        required: true
        type: string
  workflow_run:
    workflows: ["Production Backup Daily"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: hache-natacion-production-restore-drill
  cancel-in-progress: false

jobs:
  restore-real-backup:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'schedule' &&
          github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RPO_SECONDS: ${{ github.event_name == 'workflow_run' && '86400' || github.event.inputs.rpo_seconds }}
      RTO_SECONDS: ${{ github.event_name == 'workflow_run' && '3600' || github.event.inputs.rto_seconds }}
    steps:
      - name: Decide whether recurring drill is due
        id: cadence
        env:
          BACKUP_CREATED_AT: ${{ github.event.workflow_run.created_at }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -n "$BACKUP_CREATED_AT"
          backup_day="$(date -u -d "$BACKUP_CREATED_AT" +%d)"
          if [[ "$backup_day" == "01" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate recovery objectives and recurring contract
        if: ${{ steps.cadence.outputs.should_run == 'true' }}
        run: |
          set -Eeuo pipefail
          max=9223372036854775807
          valid_positive_decimal() {
            local value="$1"
            [[ "$value" =~ ^[1-9][0-9]*$ ]] || return 1
            ((${#value} < ${#max})) && return 0
            ((${#value} > ${#max})) && return 1
            [[ "$value" == "$max" || "$value" < "$max" ]]
          }
          valid_positive_decimal "$RPO_SECONDS"
          valid_positive_decimal "$RTO_SECONDS"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            [[ "$RPO_SECONDS" == "86400" ]]
            [[ "$RTO_SECONDS" == "3600" ]]
          fi

      - name: Configure SSH
        if: ${{ steps.cadence.outputs.should_run == 'true' }}
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Restore latest complete production backup into isolated DB
        if: ${{ steps.cadence.outputs.should_run == 'true' }}
        id: restore
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          chmod 700 evidence

          set +e
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo /usr/local/sbin/deploy-hache-natacion restore-drill '$RPO_SECONDS' '$RTO_SECONDS' '$GITHUB_RUN_ID'" \
            > evidence/restore-drill.json
          rc=$?
          set -e

          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -s evidence/restore-drill.json

      - name: Validate minimized restore evidence
        if: ${{ steps.cadence.outputs.should_run == 'true' }}
        env:
          HELPER_EXIT_CODE: ${{ steps.restore.outputs.exit_code }}
        run: |
          set -Eeuo pipefail
          php -r '
            $p=json_decode(file_get_contents("evidence/restore-drill.json"),true,512,JSON_THROW_ON_ERROR);
            $run=(string)getenv("GITHUB_RUN_ID");
            $expectedTarget="hache_restore_".$run;
            $ok=(string)getenv("HELPER_EXIT_CODE")==="0"
              && ($p["schema_version"]??null)===1
              && ($p["evidence_type"]??"")==="production_restore_drill"
              && ($p["result"]??"")==="PASS"
              && ($p["production_backup_selected"]??false)===true
              && ($p["production_backup_used"]??false)===true
              && ($p["isolated_target"]??false)===true
              && ($p["target_database"]??"")===$expectedTarget
              && ($p["critical_tables_verified"]??false)===true
              && ($p["financial_guards_verified"]??false)===true
              && ($p["cleanup_status"]??"")==="passed"
              && ($p["rpo_seconds"]??0)===(int)getenv("RPO_SECONDS")
              && ($p["rto_seconds"]??0)===(int)getenv("RTO_SECONDS")
              && ($p["rpo_met"]??false)===true
              && ($p["rto_met"]??false)===true
              && ($p["contains_personal_rows"]??true)===false
              && ($p["contains_credentials"]??true)===false;
            if(!$ok){fwrite(STDERR,"restore evidence did not satisfy the approved contract\n");exit(1);}
          '

      - name: Upload minimized restore evidence
        if: ${{ always() && steps.cadence.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-real-restore-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/restore-drill.json
          if-no-files-found: ignore
          retention-days: 90
