name: Temporary Sharky next-action patch

on:
  push:
    branches:
      - fix/sharky-commercial-next-action-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sharky-commercial-next-action-20260903
          fetch-depth: 0

      - name: Apply exact scoped patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adapter = Path('config/sharky-whatsapp-adapter.php')
          s = adapter.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          old = """        $state=hache_sharky_orchestrator_clear_flow($state);\n        return [$state,hache_sharky_orchestrator_decision('commercial_ready',$message.' '.hache_sharky_whatsapp_commercial_ready_message($state,'Perfecto.'))];\n"""
          new = """        $state=hache_sharky_orchestrator_clear_flow($state);\n        return [$state,hache_sharky_whatsapp_commercial_next_action($state,$message.' Perfecto.')];\n"""
          replace_once(old, new, 'known venue commercial ready')

          old = """        $state=hache_sharky_orchestrator_clear_flow($state);\n        return [$state,hache_sharky_orchestrator_decision('commercial_ready',hache_sharky_whatsapp_commercial_ready_message($state))];\n"""
          new = """        $state=hache_sharky_orchestrator_clear_flow($state);\n        return [$state,hache_sharky_whatsapp_commercial_next_action($state)];\n"""
          replace_once(old, new, 'selected venue commercial ready')

          marker = """function hache_sharky_whatsapp_registration_offer_from_context(array $state,int $now,string $prefix='Perfecto.'): array\n"""
          if s.count(marker) != 1:
              raise SystemExit('commercial menu insertion marker missing or duplicated')
          helper = """function hache_sharky_whatsapp_commercial_next_action(array $state,string $prefix='Perfecto.'): array\n{\n    $commercial=is_array($state['commercial_context']??null)?$state['commercial_context']:[];\n    $program=($commercial['program']??null)==='regular'?'clases regulares':'curso intensivo';\n    $sede=($commercial['sede_clave']??null)==='MONTEVERDE'?'Monteverde':'Palapas Protudec';\n    $age=is_int($commercial['age']??null)?' para una persona de '.(int)$commercial['age'].' años':'';\n    $message=rtrim($prefix).' Ya tengo: '.$program.' en '.$sede.$age.'. ¿Qué quieres ver ahora?';\n    $buttons=[\n        hache_sharky_orchestrator_button('action:commercial_schedules','Horarios'),\n        hache_sharky_orchestrator_button('action:commercial_price','Precio'),\n    ];\n    if(($commercial['program']??null)==='intensive')$buttons[]=hache_sharky_orchestrator_button('action:register_intensive','Inscribirme');\n    return hache_sharky_orchestrator_decision('commercial_next_action',$message,['type'=>'buttons','buttons'=>$buttons]);\n}\n\n"""
          s = s.replace(marker, helper + marker, 1)

          old = """    $greeting=preg_replace('/^[.!?¿¡\\s]+|[.!?¿¡\\s]+$/u','',$t)??$t;\n    return preg_match('/^(?:hola|holi|buenas|hey|ey|que\\s+tal|ola)$/u',$greeting)===1;\n"""
          new = """    $greeting=preg_replace('/^[.!?¿¡\\s]+|[.!?¿¡\\s]+$/u','',$t)??$t;\n    return preg_match('/^(?:hola|holi|buenas|hey|ey|que\\s+tal|ola|ok|oki|okay|vale|dale|listo|bien|perfecto|genial|continuar|continua|seguir|sigue|informacion|info)$/u',$greeting)===1;\n"""
          replace_once(old, new, 'low-information continuation vocabulary')

          old = """        if(trim((string)($event['interactive_id']??''))===''&&!is_array($state['flow']??null)&&hache_sharky_whatsapp_commercial_ready($state)&&hache_sharky_whatsapp_low_information_reengagement((string)($event['text']??''))){\n            if(($state['commercial_context']['program']??null)==='intensive')[$state,$decision]=hache_sharky_whatsapp_registration_offer_from_context($state,(int)$context['now'],'Sigo contigo.');\n            else $decision=hache_sharky_orchestrator_decision('commercial_reengagement',hache_sharky_whatsapp_commercial_ready_message($state,'Sigo contigo.'));\n"""
          new = """        if(trim((string)($event['interactive_id']??''))===''&&!is_array($state['flow']??null)&&hache_sharky_whatsapp_commercial_ready($state)&&hache_sharky_whatsapp_low_information_reengagement((string)($event['text']??''))){\n            $decision=hache_sharky_whatsapp_commercial_next_action($state,'Sigo contigo.');\n"""
          replace_once(old, new, 'commercial reengagement menu')

          old = """        }elseif(($decision['kind']??'')==='conversation'&&!hache_sharky_whatsapp_commercial_ready($stateBeforeOrchestrate)&&hache_sharky_whatsapp_commercial_ready($state)&&hache_sharky_whatsapp_turn_is_discovery_only((string)($event['text']??''))){\n            if(($state['commercial_context']['program']??null)==='intensive')[$state,$decision]=hache_sharky_whatsapp_registration_offer_from_context($state,(int)$context['now']);\n            else $decision=hache_sharky_orchestrator_decision('commercial_ready',hache_sharky_whatsapp_commercial_ready_message($state));\n        }\n"""
          new = """        }elseif(($decision['kind']??'')==='conversation'&&!hache_sharky_whatsapp_commercial_ready($stateBeforeOrchestrate)&&hache_sharky_whatsapp_commercial_ready($state)&&hache_sharky_whatsapp_turn_is_discovery_only((string)($event['text']??''))){\n            $decision=hache_sharky_whatsapp_commercial_next_action($state);\n        }\n"""
          replace_once(old, new, 'discovery completion menu')

          adapter.write_text(s)

          test = Path('tests/sharky-guided-onboarding-regression.php')
          t = test.read_text()
          marker = 'echo "SHARKY_GUIDED_ONBOARDING_OK\\n";\n'
          if t.count(marker) != 1:
              raise SystemExit('guided regression end marker missing or duplicated')
          block = r'''
// Production regression: once program + venue are confirmed, short continuations must
// restore a deterministic next-action menu instead of falling through to the LLM.
$commercialMenuState=$prospect;
$commercialMenuState['commercial_context']['program']='intensive';
$commercialMenuState['commercial_context']['sede_clave']='PALAPAS';
$commercialMenu=hache_sharky_whatsapp_commercial_next_action($commercialMenuState);
guided_ok(($commercialMenu['kind']??null)==='commercial_next_action','Commercially ready intensive prospects must receive a deterministic next-action menu.');
guided_ok(array_column($commercialMenu['ui']['buttons']??[],'id')===['action:commercial_schedules','action:commercial_price','action:register_intensive'],'Intensive next-action menu must offer Horarios, Precio and Inscribirme in that order.');
$commercialPayload=hache_sharky_whatsapp_render('529980000000',$commercialMenu);
guided_ok(($commercialPayload['type']??null)==='interactive'&&count($commercialPayload['interactive']['action']['buttons']??[])===3,'Commercial next-action menu must render as three WhatsApp buttons.');
foreach(['Oki','Continuar','Información','Ok','Dale'] as $continuation){
    guided_ok(hache_sharky_whatsapp_low_information_reengagement($continuation),$continuation.' must restore the current commercial menu instead of reaching free conversation.');
}
guided_ok(!hache_sharky_whatsapp_low_information_reengagement('¿Cuánto cuesta?'),'A substantive price question must still reach the normal contextual answer path.');

// Old production screenshot regression: confirmed regular + Palapas context must not
// re-ask venue or resurrect Monteverde as a new choice.
$knownPalapas=$prospect;
$knownPalapas['commercial_context']['program']='regular';
$knownPalapas['commercial_context']['sede_clave']='PALAPAS';
$knownPalapas['commercial_context']['age']=59;
$filteredKnownVenue=hache_sharky_whatsapp_enforce_confirmed_context('Tenemos clases regulares en Monteverde y Palapas. ¿En qué sede prefieres tomar las clases: Monteverde o Palapas Protudec?',$knownPalapas);
guided_ok(!hache_sharky_whatsapp_answer_asks_slot($filteredKnownVenue,'sede'),'Confirmed Palapas context must never re-ask the venue.');

$adapterSource=file_get_contents(__DIR__.'/../config/sharky-whatsapp-adapter.php')?:'';
guided_ok(substr_count($adapterSource,'hache_sharky_whatsapp_commercial_next_action($state')>=4,'All commercial completion/reengagement paths must converge on the deterministic next-action menu.');

'''
          t = t.replace(marker, block + marker, 1)
          test.write_text(t)
          PY

          rm .github/workflows/tmp-sharky-next-action-patch.yml

          git config user.name "Hache Interactive Automation"
          git config user.email "manglefurniture@gmail.com"
          git add config/sharky-whatsapp-adapter.php tests/sharky-guided-onboarding-regression.php .github/workflows/tmp-sharky-next-action-patch.yml
          git diff --cached --check
          git commit -m "fix: keep Sharky moving after commercial discovery"
          git push origin HEAD:fix/sharky-commercial-next-action-20260903
